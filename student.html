<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student - Take Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👨‍🎓 Take Quiz</h1>
            <button class="btn btn-outline" onclick="window.location.href='index.html'">← Back to Home</button>
        </div>

        <div id="quizSelection" class="card">
            <h2>Select a Quiz</h2>
            <div id="availableQuizzes"></div>
        </div>

        <div id="quizContainer" class="quiz-container" style="display: none;">
            <div class="quiz-header">
                <h2 id="quizTitle"></h2>
                <div class="quiz-info">
                    <span id="questionNumber">Question 1 of 1</span>
                    <div class="timer-container">
                        <span class="timer-label">Time Remaining:</span>
                        <span id="timer" class="timer">30</span>
                    </div>
                </div>
            </div>

            <div class="question-card card">
                <h3 id="questionText"></h3>
                <div id="optionsContainer" class="options-container"></div>
            </div>

            <div class="quiz-actions">
                <button class="btn btn-outline" onclick="previousQuestion()" id="prevBtn" style="display: none;">← Previous</button>
                <button class="btn btn-primary" onclick="nextQuestion()" id="nextBtn">Next →</button>
                <button class="btn btn-success" onclick="submitQuiz()" id="submitBtn" style="display: none;">Submit Quiz</button>
            </div>
        </div>

        <div id="resultsContainer" class="results-container card" style="display: none;">
            <h2>🎉 Quiz Completed!</h2>
            <div class="score-display">
                <div class="score-circle">
                    <span id="scoreValue">0</span>
                    <span class="score-label">/ <span id="totalQuestions">0</span></span>
                </div>
                <div class="score-percentage" id="scorePercentage">0%</div>
            </div>
            
            <div class="results-actions">
                <button class="btn btn-primary" onclick="restartQuiz()">Take Another Quiz</button>
                <button class="btn btn-outline" onclick="viewDetails()">View Details</button>
            </div>

            <div id="quizDetails" style="display: none; margin-top: 20px;">
                <h3>Question Details</h3>
                <div id="detailsList"></div>
            </div>
        </div>
    </div>

    <script src="student.js"></script>
</body>
</html>
