<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎓 Quiz Application</h1>
            <p class="subtitle">Choose your role to get started</p>
            
            <div class="button-group">
                <button class="btn btn-primary" onclick="accessTeacherMode()">
                    👨‍🏫 Teacher Mode
                    <span>Create and manage quizzes</span>
                </button>
                
                <button class="btn btn-secondary" onclick="window.location.href='student.html'">
                    👨‍🎓 Student Mode
                    <span>Take quizzes and see your score</span>
                </button>
            </div>
            
            <script src="auth.js"></script>
            <script>
                function accessTeacherMode() {
                    if (authenticateTeacher()) {
                        window.location.href = 'teacher.html';
                    }
                }
            </script>
        </div>
    </div>
</body>
</html>
